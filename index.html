<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>AutoReel — Descoperă mașini</title>
  <meta name="description" content="Nu mai cauți mașini. Le descoperi. Marketplace video-first pentru mașini second-hand în România.">
  <meta name="theme-color" content="#FF6A00">

  <!-- Open Graph (share preview pe WhatsApp / Facebook / iMessage) -->
  <meta property="og:title" content="AutoReel — Descoperă mașini">
  <meta property="og:description" content="Nu mai cauți mașini. Le descoperi.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://autoreel.ro">
  <meta property="og:image" content="https://autoreel.ro/og-image.png">

  <!-- Apple smart banner — deschide app-ul dacă e instalat -->
  <meta name="apple-itunes-app" content="app-id=YOUR_APPLE_APP_ID">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #0E0E14;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 106, 0, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 122, 31, 0.2) 0%, transparent 50%);
    }
    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #FFB070, #FF7A1F 50%, #D63E00);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(255, 106, 0, 0.4);
    }
    .logo svg { width: 64px; height: 64px; }
    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .tagline {
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #FF8A2C, #FF5500);
      color: #fff;
      box-shadow: 0 8px 20px rgba(255, 106, 0, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .footer {
      margin-top: 40px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <g fill="#FFFFFF">
          <path fill-rule="evenodd" d="M 56 183 L 84 73 L 96 73 L 124 183 Z M 79 152 L 101 152 L 109 183 L 71 183 Z"/>
          <rect x="138" y="73" width="22" height="110"/>
          <path fill-rule="evenodd" d="M 160 73 L 180 73 C 202 73 202 138 180 138 L 160 138 Z M 160 91 L 176 91 C 188 91 188 120 176 120 L 160 120 Z"/>
          <path d="M 160 138 L 180 138 L 202 183 L 182 183 Z"/>
        </g>
      </svg>
    </div>
    <h1>AutoReel</h1>
    <p class="tagline">Nu mai cauți mașini.<br>Le descoperi.</p>
    <div class="buttons">
      <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.autoreel.autoreel">
        Descarcă pentru Android
      </a>
      <a class="btn btn-secondary" href="https://apps.apple.com/app/idYOUR_APPLE_APP_ID">
        Descarcă pentru iPhone
      </a>
    </div>
    <p class="footer">© AutoReel · Made in Brașov 🇷🇴</p>
  </div>

  <script>
    // Smart redirect: dacă utilizatorul deschide un URL specific (ex: /car/123)
    // dintr-un mesaj WhatsApp, încercăm să deschidem app-ul.
    // Pe iOS și Android cu Universal/App Links configurate, OS-ul face asta
    // automat înainte ca această pagină să se încarce. Codul de mai jos
    // e fallback dacă app-ul nu e instalat.

    const path = window.location.pathname;
    const isCarLink = /^\/car\/[a-f0-9-]+/.test(path);
    const isDealerLink = /^\/dealer\/[a-f0-9-]+/.test(path);

    if (isCarLink || isDealerLink) {
      // Sper că OS-ul a interceptat link-ul deja. Dacă suntem aici,
      // înseamnă că app-ul nu e instalat → arătăm landing-ul cu CTA install.
      document.title = 'Deschide în AutoReel';
    }
  </script>
</body>
</html>
