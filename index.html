  <script>
    // Deep link routing pentru utilizatorii care intră via share link.
    // Pe iOS/Android cu app-ul instalat, OS-ul interceptează link-ul ÎNAINTE
    // ca această pagină să se încarce. Codul de aici e fallback.
    const path = window.location.pathname;
    if (/^\/car\/[a-f0-9-]+/.test(path) || /^\/dealer\/[a-f0-9-]+/.test(path)) {
      document.title = 'Deschide în AutoReel';
    }
